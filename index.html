<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPASIAL - Clash of Champhion</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:#071b49 url("BECRAUND.webp") center/cover no-repeat;
  color:#fff;overflow:hidden;
  font-family:system-ui,"Segoe UI",Arial,sans-serif;
}

/* Tulisan pojok kiri atas */
.brand{position:absolute;top:clamp(16px,3vw,32px);left:clamp(16px,3vw,40px);z-index:5}
.brand h1{font-size:clamp(1.4rem,3vw,2.2rem);font-weight:800;letter-spacing:.14em;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.brand p{margin-top:8px;font-size:clamp(.65rem,1.2vw,.85rem);letter-spacing:.12em;color:#cfe0ff;text-shadow:0 2px 10px rgba(0,0,0,.7)}

/* Scene tepat di tengah layar */
.stage{height:100svh;display:grid;place-items:center}
.scene{width:min(90vw,84svh,720px);aspect-ratio:1}
.scene svg{display:block;width:100%;height:100%;pointer-events:none} /* area kosong tidak bisa diklik */

/* ===== KUBUS: hover membesar, klik pindah halaman ===== */
/* ===== KUBUS: hover membesar halus, klik pindah halaman ===== */
.scene{position:relative}
.cube,.cube *{pointer-events:auto}
.cube{cursor:pointer;outline:none}

/* SVG jadi satu lapisan GPU, jadi geraknya mulus */
.scene svg{
  will-change:transform;
  transition:transform .7s cubic-bezier(.22,1,.36,1);   /* mulus, tanpa memantul */
}
.scene:has(.cube:hover) svg,
.scene:has(.cube:focus-visible) svg{transform:scale(1.12)}   /* atur besar zoom di sini */
.scene:has(.cube:active) svg{transform:scale(1.07)}

/* Cahaya hover di lapisan terpisah (lebih ringan dari filter) */
.scene::before{
  content:"";position:absolute;inset:10%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(90,170,255,.55),transparent 65%);
  opacity:0;transition:opacity .7s ease;
}
.scene:has(.cube:hover)::before,
.scene:has(.cube:focus-visible)::before{opacity:1}

/* Animasi saat diklik */
.scene.go svg{
  transform:scale(6);opacity:0;
  transition:transform .9s cubic-bezier(.55,0,.25,1),opacity .9s ease-in;
}
.scene.go::before{opacity:0}

@media (prefers-reduced-motion:reduce){.scene svg,.scene::before,.scene.go svg{transition:none}}
</style>
</head>
<body>

<div class="brand">
  <h1>SPASIAL</h1>
  <p>CLASH OF CHAMPHION BY PKSE UNJA</p>
</div>

<main class="stage">
  <div class="scene">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 
    SBG (Spatial Blue Geometric) - ROUNDED EDITION
    Dibangun dengan kurva Bezier isometrik untuk sudut lengkung murni vektor.
  -->
  <defs>
    <!-- Filter Glow untuk Aura Belakang -->
    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Filter Glow untuk Garis Neon (Outline) -->
    <filter id="neonEdgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradasi Sisi Atas: Putih Kebiruan Bercahaya -->
    <linearGradient id="topGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c4e1ff" />
    </linearGradient>

    <!-- Gradasi Sisi Kiri: Biru Elektrik (Sisi Terang) -->
    <linearGradient id="leftGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a46d1" />
      <stop offset="40%" stop-color="#2a75fa" />
      <stop offset="100%" stop-color="#73baff" />
    </linearGradient>

    <!-- Gradasi Sisi Kanan: Biru Royal (Sisi Gelap/Bayangan) -->
    <linearGradient id="rightGradient" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#031545" />
      <stop offset="50%" stop-color="#0b2e8a" />
      <stop offset="100%" stop-color="#2661d9" />
    </linearGradient>

    <!-- Gradasi khusus untuk tiang cahaya tengah -->
    <linearGradient id="lineGlowGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#80c6ff" />
    </linearGradient>

    <!-- 
      Jalur Induk Heksagon dengan Sudut Melengkung (Rounded Corners) 
      Menggunakan kurva Bezier (Q) pada setiap ujungnya.
    -->
    <path id="roundedHexagon" d="
      M -13.856,-112 
      Q 0,-120 13.856,-112 
      L 90.064,-68 
      Q 103.92,-60 103.92,-44 
      L 103.92,44 
      Q 103.92,60 90.064,68 
      L 13.856,112 
      Q 0,120 -13.856,112 
      L -90.064,68 
      Q -103.92,60 -103.92,44 
      L -103.92,-44 
      Q -103.92,-60 -90.064,-68 
      Z" />

    <!-- ClipPath untuk memotong sisi dalam kubus agar mengikuti lengkungan luar -->
    <clipPath id="roundedClip">
      <use href="#roundedHexagon" />
    </clipPath>
  </defs>

  <!-- LINK KUBUS: ganti "halaman2.html" dengan halaman tujuanmu nanti -->
  <a class="cube" href="halaman2.html" aria-label="Masuk ke halaman berikutnya">

  <!-- Grup Utama yang memusatkan kubus di tengah viewport -->
  <g transform="translate(250, 250)">
    
    <!-- Aura Biru di Belakang Kubus (mengikuti bentuk lengkung) -->
    <use href="#roundedHexagon" fill="#2277ff" opacity="0.3" filter="url(#ambientGlow)" />

    <!-- ==================== PERMUKAAN KUBUS 3D ==================== -->
    <g clip-path="url(#roundedClip)">
      
      <!-- Sisi Kanan (Biru Royal) -->
      <polygon points="0,0 103.92,-60 103.92,60 0,120" fill="url(#rightGradient)" />

      <!-- Sisi Kiri (Biru Elektrik) -->
      <polygon points="-103.92,-60 0,0 0,120 -103.92,60" fill="url(#leftGradient)" />
               
      <!-- Sisi Atas (Putih Kebiruan) -->
      <polygon points="0,-120 103.92,-60 0,0 -103.92,-60" fill="url(#topGradient)" />
      
    </g>

    <!-- ==================== OUTLINE / RUSUK BERSINAR ==================== -->
    
    <!-- Lapisan 1: Cahaya Neon (Tebal & Blur) -->
    <g filter="url(#neonEdgeGlow)" fill="none" stroke="#66c2ff" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <use href="#roundedHexagon" />
      <path d="M 0,0 L 100.456,-58 M 0,0 L 0,116 M 0,0 L -100.456,-58" />
    </g>

    <!-- Lapisan 2: Inti Garis Tajam (Tipis, Putih-Cyan) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#roundedHexagon" stroke="#e0f2ff" stroke-width="1.5" />
      <path d="M 0,0 L 100.456,-58 M 0,0 L -100.456,-58" stroke="#e0f2ff" stroke-width="1.5" />
      <path d="M 0,0 L 0,116" stroke="url(#lineGlowGradient)" stroke-width="2.5" />
    </g>

  </g>
  </a>
</svg>

  </div>
</main>

<script>
  // Klik kubus: zoom besar + memudar, lalu pindah ke halaman tujuan
  const scene = document.querySelector(".scene");
  const cube  = document.querySelector(".cube");
  cube.addEventListener("click", e => {
    e.preventDefault();
    const url = cube.getAttribute("href");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { location.href = url; return; }
    scene.classList.add("go");
    setTimeout(() => location.href = url, 850);
  });
</script>

</body>
</html>
